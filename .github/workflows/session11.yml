name: Session 11 synthetic workflow

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session11-test-and-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest==9.0.3
      - name: Test synthetic workflow
        run: python -m pytest test_session11_workflow.py -v
      - name: Run synthetic workflow end to end
        run: python session11_workflow.py
